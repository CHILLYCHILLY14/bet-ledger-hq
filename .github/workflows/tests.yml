name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["data/tickets/**"]
  pull_request:
  workflow_dispatch:

# Sync/server tests use an in-memory sheet. Browser checks use local fixtures;
# no test contacts a live spreadsheet or writes actual wagers.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/test_betsync.mjs
      - run: node tests/test_server.mjs
      - run: node --check hub.js && node --check hq.js && node --check today.js && node --check today-core.js && node --check archive.js && node --check ticket-renderer.js && node --check scripts/refresh-tickets.mjs

      - run: node tests/test_tickets.mjs
      - run: node tests/test_today.mjs
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-browser-checks
          path: test-results/
